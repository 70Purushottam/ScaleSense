events {
  worker_connections 4096;
}

http {
  log_format up '$remote_addr "$request" $status upstream=$upstream_addr t=$request_time';
  access_log /dev/stdout up;

  server {
    listen 80;
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
      set $backend http://api:8000;
      proxy_pass $backend;
    }
  }
}